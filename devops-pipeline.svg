<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
<defs><style>
body{font-family:Inter,Arial,sans-serif}
.node{fill:#0d1117;stroke:#30363d;stroke-width:1.2}
.title{fill:#c9d1d9;font:600 15px Inter,Arial,sans-serif}
.sub{fill:#8b949e;font:11px Inter,Arial,sans-serif}
.line{stroke:#30363d;stroke-width:2}
.dot{fill:#39d353;filter:url(#glow);animation:move 3.8s linear infinite}
.dot2{fill:#58a6ff;filter:url(#glow);animation:move2 3.8s linear infinite}
@keyframes move{0%{transform:translateX(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(640px);opacity:0}}
@keyframes move2{0%{transform:translateX(0);opacity:0}25%{opacity:0}35%{opacity:1}90%{opacity:1}100%{transform:translateX(640px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
</style>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="100%" height="100%" rx="14" fill="#0d1117"/>
<text x="26" y="30" class="title">Delivery Pipeline</text>
<text x="26" y="50" class="sub">commit → build → test → containerize → deploy</text>
<rect x="40" y="90" width="145" height="70" rx="10" class="node"/>
<text x="112" y="120" text-anchor="middle" class="title">SOURCE</text>
<text x="112" y="142" text-anchor="middle" class="sub">git</text>
<rect x="230" y="90" width="145" height="70" rx="10" class="node"/>
<text x="302" y="120" text-anchor="middle" class="title">BUILD</text>
<text x="302" y="142" text-anchor="middle" class="sub">CI</text>
<rect x="420" y="90" width="145" height="70" rx="10" class="node"/>
<text x="492" y="120" text-anchor="middle" class="title">TEST</text>
<text x="492" y="142" text-anchor="middle" class="sub">checks</text>
<rect x="610" y="90" width="145" height="70" rx="10" class="node"/>
<text x="682" y="120" text-anchor="middle" class="title">CONTAINER</text>
<text x="682" y="142" text-anchor="middle" class="sub">Docker</text>
<rect x="800" y="90" width="145" height="70" rx="10" class="node"/>
<text x="872" y="120" text-anchor="middle" class="title">DEPLOY</text>
<text x="872" y="142" text-anchor="middle" class="sub">AWS / K8s</text>
<line x1="185" y1="125" x2="230" y2="125" class="line"/>
<line x1="375" y1="125" x2="420" y2="125" class="line"/>
<line x1="565" y1="125" x2="610" y2="125" class="line"/>
<line x1="755" y1="125" x2="800" y2="125" class="line"/>
<circle class="dot" cx="190" cy="125" r="4" style="animation-delay:0.0s"/>
<circle class="dot2" cx="190" cy="125" r="2.6" style="animation-delay:1.2s"/>
<circle class="dot" cx="380" cy="125" r="4" style="animation-delay:0.7s"/>
<circle class="dot2" cx="380" cy="125" r="2.6" style="animation-delay:1.9s"/>
<circle class="dot" cx="570" cy="125" r="4" style="animation-delay:1.4s"/>
<circle class="dot2" cx="570" cy="125" r="2.6" style="animation-delay:2.5999999999999996s"/>
<circle class="dot" cx="760" cy="125" r="4" style="animation-delay:2.0999999999999996s"/>
<circle class="dot2" cx="760" cy="125" r="2.6" style="animation-delay:3.3s"/>
<text x="40" y="195" class="sub">AWS</text><text x="120" y="195" class="sub">Kubernetes</text><text x="230" y="195" class="sub">Terraform</text><text x="335" y="195" class="sub">GitHub Actions</text><text x="480" y="195" class="sub">Linux</text><text x="560" y="195" class="sub">Docker</text><text x="660" y="195" class="sub">Observability</text></svg>