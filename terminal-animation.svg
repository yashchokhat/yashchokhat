<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <style>
      .bg{fill:#0d1117}.bar{fill:#161b22}.t{font:14px 'JetBrains Mono','Courier New',monospace;fill:#c9d1d9}.dim{fill:#8b949e}.green{fill:#39d353}.blue{fill:#58a6ff}.cyan{fill:#39c5cf}.yellow{fill:#d29922}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}} .scan{animation:scan 4s linear infinite}@keyframes scan{0%{transform:translateY(-10px);opacity:0}10%{opacity:.45}90%{opacity:.45}100%{transform:translateY(275px);opacity:0}} .pop{animation:pop 2.6s ease-in-out infinite}@keyframes pop{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="300" rx="14"/>
  <rect class="bar" x="0" y="0" width="1000" height="38" rx="14"/>
  <circle cx="20" cy="19" r="6" fill="#ff5f56"/><circle cx="42" cy="19" r="6" fill="#ffbd2e"/><circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text class="dim" x="88" y="24">yash@vertex-lab — terminal</text>
  <rect class="scan" x="8" y="44" width="984" height="1" fill="#39d353" opacity="0"/>

  <text class="t" x="28" y="72">$ whoami</text>
  <text class="green pop" x="28" y="96">yash.p.chokhat</text>
  <text class="t" x="28" y="128">$ stack --show</text>
  <text class="blue" x="28" y="152">react  next.js  node  flutter</text>
  <text class="cyan" x="28" y="176">aws  docker  kubernetes  terraform</text>
  <text class="yellow" x="28" y="200">linux  github-actions  ci/cd  devops</text>
  <text class="t" x="28" y="232">$ deploy vertex-lab</text>
  <text class="green" x="28" y="256">[##########] production ready</text>
  <text class="t" x="360" y="256">$</text><rect class="cursor" x="375" y="243" width="8" height="16" fill="#39d353"/>
</svg>
